name: Example CCRubrikPOCTest Apply

on:
  workflow_dispatch:
    inputs:
      working_directory:
        description: Terraform working directory
        required: true
        default: ./examples/cc-rubrik-poc-test
        type: string
      account_id:
        description: AWS account ID for OIDC role assumption
        required: true
        default: "118490267426"
        type: string
      aws_region:
        description: AWS region
        required: true
        default: eu-west-2
        type: string
      state_bucket:
        description: S3 backend bucket name
        required: true
        default: cc-rubrik-poc-test-tfstate-opensearch
        type: string
      state_key:
        description: S3 backend state key
        required: true
        default: opensearch/example/terraform.tfstate
        type: string
      state_dynamodb_table:
        description: Optional DynamoDB state lock table name
        required: false
        default: ""
        type: string
      role_to_assume:
        description: OIDC role name to assume for Terraform actions
        required: true
        default: ""
        type: string
      apply_branch:
        description: Branch allowed to run apply
        required: true
        default: main
        type: string
      confirm_apply:
        description: Required. Type APPLY to continue.
        required: true
        default: ""
        type: string

permissions:
  contents: read
  id-token: write
  actions: read

jobs:
  terraform-plan:
    name: Terraform Plan Example
    if: inputs.confirm_apply == 'APPLY' && github.ref_name == inputs.apply_branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Terraform Init
        id: init
        uses: Home-Office-Digital/core-cloud-workflow-terraform-actions/actions/init@main
        with:
          working-directory: "${{ inputs.working_directory }}"
          account_id: "${{ inputs.account_id }}"
          aws-region: "${{ inputs.aws_region }}"
          role-to-assume: "${{ inputs.role_to_assume }}"
          state-bucket: "${{ inputs.state_bucket }}"
          state-key: "${{ inputs.state_key }}"
          state-dynamodb-table: "${{ inputs.state_dynamodb_table }}"

      - name: Terraform Plan
        id: plan
        uses: Home-Office-Digital/core-cloud-workflow-terraform-actions/actions/plan@main
        with:
          working-directory: "${{ inputs.working_directory }}"
          account_id: "${{ inputs.account_id }}"
          aws-region: "${{ inputs.aws_region }}"
          role-to-assume: "${{ inputs.role_to_assume }}"

  terraform-apply:
    name: Terraform Apply Example
    needs: terraform-plan
    if: inputs.confirm_apply == 'APPLY' && github.ref_name == inputs.apply_branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Terraform Init
        id: init
        uses: Home-Office-Digital/core-cloud-workflow-terraform-actions/actions/init@main
        with:
          working-directory: "${{ inputs.working_directory }}"
          account_id: "${{ inputs.account_id }}"
          aws-region: "${{ inputs.aws_region }}"
          role-to-assume: "${{ inputs.role_to_assume }}"
          state-bucket: "${{ inputs.state_bucket }}"
          state-key: "${{ inputs.state_key }}"
          state-dynamodb-table: "${{ inputs.state_dynamodb_table }}"

      - name: Terraform Apply
        id: apply
        uses: Home-Office-Digital/core-cloud-workflow-terraform-actions/actions/apply@main
        with:
          apply-branch: "${{ inputs.apply_branch }}"
          working-directory: "${{ inputs.working_directory }}"
          account_id: "${{ inputs.account_id }}"
          aws-region: "${{ inputs.aws_region }}"
          role-to-assume: "${{ inputs.role_to_assume }}"

  apply-safety-check:
    name: Apply Safety Check
    if: inputs.confirm_apply != 'APPLY' || github.ref_name != inputs.apply_branch
    runs-on: ubuntu-latest
    steps:
      - name: Explain apply requirements
        run: |
          echo "Apply was requested but safety requirements were not met."
          echo "Requirements:"
          echo "1) Run from apply_branch"
          echo "2) Set confirm_apply to APPLY"
          exit 1
