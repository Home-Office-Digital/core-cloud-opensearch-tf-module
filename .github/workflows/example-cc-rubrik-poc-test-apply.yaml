name: Example CCRubrikPOCTest Apply

on:
  workflow_run:
    workflows:
      - Example CCRubrikPOCTest Plan
    types:
      - completed
  workflow_dispatch:
    inputs:
      working_directory:
        description: Terraform working directory
        required: true
        default: ./examples/cc-rubrik-poc-test
        type: string
      aws_region:
        description: AWS region
        required: true
        default: eu-west-2
        type: string
      state_bucket:
        description: S3 backend bucket name
        required: true
        default: cc-rubrik-poc-test-tfstate-opensearch
        type: string
      state_key:
        description: S3 backend state key
        required: true
        default: opensearch/example/terraform.tfstate
        type: string
      state_dynamodb_table:
        description: Optional DynamoDB state lock table name
        required: false
        default: ""
        type: string
      apply_branch:
        description: Branch allowed to run apply
        required: true
        default: feature/CCL-10788-openseach-module
        type: string
      confirm_apply:
        description: Required. Type APPLY to continue.
        required: true
        default: ""
        type: string

permissions:
  contents: read
  id-token: write
  actions: read

jobs:
  terraform-plan:
    name: Terraform Plan Example
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'feature/CCL-10788-openseach-module') ||
      (github.event_name == 'workflow_dispatch' && inputs.confirm_apply == 'APPLY' && github.ref_name == inputs.apply_branch)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: "${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}"

      - name: Terraform Init
        id: init
        uses: Home-Office-Digital/core-cloud-workflow-terraform-actions/actions/init@main
        with:
          working-directory: "${{ github.event_name == 'workflow_dispatch' && inputs.working_directory || './examples/cc-rubrik-poc-test' }}"
          account_id: "${{ secrets.AWS_ACCOUNT_ID }}"
          aws-region: "${{ github.event_name == 'workflow_dispatch' && inputs.aws_region || 'eu-west-2' }}"
          role-to-assume: "${{ secrets.AWS_ROLE_TO_ASSUME }}"
          state-bucket: "${{ github.event_name == 'workflow_dispatch' && inputs.state_bucket || 'cc-rubrik-poc-test-tfstate-opensearch' }}"
          state-key: "${{ github.event_name == 'workflow_dispatch' && inputs.state_key || 'opensearch/example/terraform.tfstate' }}"
          state-dynamodb-table: "${{ github.event_name == 'workflow_dispatch' && inputs.state_dynamodb_table || '' }}"

      - name: Terraform Plan
        id: plan
        uses: Home-Office-Digital/core-cloud-workflow-terraform-actions/actions/plan@main
        with:
          working-directory: "${{ github.event_name == 'workflow_dispatch' && inputs.working_directory || './examples/cc-rubrik-poc-test' }}"
          account_id: "${{ secrets.AWS_ACCOUNT_ID }}"
          aws-region: "${{ github.event_name == 'workflow_dispatch' && inputs.aws_region || 'eu-west-2' }}"
          role-to-assume: "${{ secrets.AWS_ROLE_TO_ASSUME }}"

  terraform-apply:
    name: Terraform Apply Example
    needs: terraform-plan
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'feature/CCL-10788-openseach-module') ||
      (github.event_name == 'workflow_dispatch' && inputs.confirm_apply == 'APPLY' && github.ref_name == inputs.apply_branch)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: "${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}"

      - name: Terraform Init
        id: init
        uses: Home-Office-Digital/core-cloud-workflow-terraform-actions/actions/init@main
        with:
          working-directory: "${{ github.event_name == 'workflow_dispatch' && inputs.working_directory || './examples/cc-rubrik-poc-test' }}"
          account_id: "${{ secrets.AWS_ACCOUNT_ID }}"
          aws-region: "${{ github.event_name == 'workflow_dispatch' && inputs.aws_region || 'eu-west-2' }}"
          role-to-assume: "${{ secrets.AWS_ROLE_TO_ASSUME }}"
          state-bucket: "${{ github.event_name == 'workflow_dispatch' && inputs.state_bucket || 'cc-rubrik-poc-test-tfstate-opensearch' }}"
          state-key: "${{ github.event_name == 'workflow_dispatch' && inputs.state_key || 'opensearch/example/terraform.tfstate' }}"
          state-dynamodb-table: "${{ github.event_name == 'workflow_dispatch' && inputs.state_dynamodb_table || '' }}"

      - name: Terraform Apply
        id: apply
        uses: Home-Office-Digital/core-cloud-workflow-terraform-actions/actions/apply@main
        with:
          apply-branch: "${{ github.event_name == 'workflow_dispatch' && inputs.apply_branch || 'feature/CCL-10788-openseach-module' }}"
          working-directory: "${{ github.event_name == 'workflow_dispatch' && inputs.working_directory || './examples/cc-rubrik-poc-test' }}"
          account_id: "${{ secrets.AWS_ACCOUNT_ID }}"
          aws-region: "${{ github.event_name == 'workflow_dispatch' && inputs.aws_region || 'eu-west-2' }}"
          role-to-assume: "${{ secrets.AWS_ROLE_TO_ASSUME }}"

  apply-safety-check:
    name: Apply Safety Check
    if: github.event_name == 'workflow_dispatch' && (inputs.confirm_apply != 'APPLY' || github.ref_name != inputs.apply_branch)
    runs-on: ubuntu-latest
    steps:
      - name: Explain apply requirements
        run: |
          echo "Apply was requested but safety requirements were not met."
          echo "Requirements:"
          echo "1) Run from apply_branch"
          echo "2) Set confirm_apply to APPLY"
          exit 1
