name: Example CCRubrikPOCTest Destroy

on:
  workflow_dispatch:
    inputs:
      working_directory:
        description: Terraform working directory
        required: true
        default: ./examples/cc-rubrik-poc-test
        type: string
      account_id:
        description: AWS account ID for OIDC role assumption
        required: true
        default: "118490267426"
        type: string
      aws_region:
        description: AWS region
        required: true
        default: eu-west-2
        type: string
      state_bucket:
        description: S3 backend bucket name
        required: true
        default: cc-rubrik-poc-test-tfstate-opensearch
        type: string
      state_key:
        description: S3 backend state key
        required: true
        default: opensearch/example/terraform.tfstate
        type: string
      state_dynamodb_table:
        description: Optional DynamoDB state lock table name
        required: false
        default: ""
        type: string
      role_to_assume:
        description: OIDC role name to assume for Terraform actions
        required: true
        default: ""
        type: string
      apply_branch:
        description: Branch allowed to run destroy
        required: true
        default: main
        type: string
      confirm_destroy:
        description: Required. Type DESTROY to continue.
        required: true
        default: ""
        type: string

permissions:
  contents: read
  id-token: write
  actions: read

jobs:
  terraform-destroy:
    name: Terraform Destroy Example
    if: inputs.confirm_destroy == 'DESTROY' && github.ref_name == inputs.apply_branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Terraform Init
        id: init
        uses: Home-Office-Digital/core-cloud-workflow-terraform-actions/actions/init@main
        with:
          working-directory: "${{ inputs.working_directory }}"
          account_id: "${{ inputs.account_id }}"
          aws-region: "${{ inputs.aws_region }}"
          role-to-assume: "${{ inputs.role_to_assume }}"
          state-bucket: "${{ inputs.state_bucket }}"
          state-key: "${{ inputs.state_key }}"
          state-dynamodb-table: "${{ inputs.state_dynamodb_table }}"

      - name: Terraform Destroy
        id: destroy
        working-directory: "${{ inputs.working_directory }}"
        run: terraform destroy -auto-approve -input=false

  destroy-safety-check:
    name: Destroy Safety Check
    if: inputs.confirm_destroy != 'DESTROY' || github.ref_name != inputs.apply_branch
    runs-on: ubuntu-latest
    steps:
      - name: Explain destroy requirements
        run: |
          echo "Destroy was requested but safety requirements were not met."
          echo "Requirements:"
          echo "1) Run from apply_branch"
          echo "2) Set confirm_destroy to DESTROY"
          exit 1
